[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fbi-api"
version = "0.1.0"
description = "Python client for the FBI Wanted Persons public API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["fbi", "api", "wanted", "client"]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "responses>=0.25",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
